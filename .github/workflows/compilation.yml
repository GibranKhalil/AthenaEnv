name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - v*
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [run_build]

permissions:
  contents: write

env:
  PS2DEV_VERSION: v2.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: git checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install PS2DEV toolchain
      run: |
        PS2DEV=/usr/local/ps2dev
        PS2SDK="$PS2DEV/ps2sdk"
        GSKIT="$PS2DEV/gsKit"

        sudo mkdir -p "$PS2DEV"
        sudo chown "$USER" "$PS2DEV"

        curl -fsSL -o ps2dev.tar.gz \
          "https://github.com/ps2dev/ps2dev/releases/download/${PS2DEV_VERSION}/ps2dev-ubuntu-latest.tar.gz"
        tar -xf ps2dev.tar.gz --strip-components 1 -C "$PS2DEV"
        rm ps2dev.tar.gz

        sed -i'' "s|/__w/ps2dev/ps2dev/ps2dev/ps2sdk/ports|${PS2SDK}/ports|g" "$PS2SDK"/ports/lib/pkgconfig/*.pc
        sed -i'' "s|/__w/ps2dev/ps2dev/ps2dev/ps2sdk/ports|${PS2SDK}/ports|g" "$GSKIT"/lib/pkgconfig/*.pc
        sed -i'' "s|/__w/ps2dev/ps2dev/ps2dev/gsKit|${GSKIT}/|g" "$GSKIT"/lib/pkgconfig/*.pc

        echo "PS2DEV=$PS2DEV" >> "$GITHUB_ENV"
        echo "PS2SDK=$PS2SDK" >> "$GITHUB_ENV"
        echo "GSKIT=$GSKIT" >> "$GITHUB_ENV"
        echo "$PS2DEV/bin" >> "$GITHUB_PATH"
        echo "$PS2DEV/ee/bin" >> "$GITHUB_PATH"
        echo "$PS2DEV/iop/bin" >> "$GITHUB_PATH"
        echo "$PS2DEV/dvp/bin" >> "$GITHUB_PATH"
        echo "$PS2SDK/bin" >> "$GITHUB_PATH"

    - name: Compile project
      run: |
        chmod +x build-exports.sh
        make clean all
      env:
        ATHENAENV_SRC: "${{ github.workspace }}/src"

    - name: Get short SHA
      id: slug
      run: echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_ENV

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: AthenaEnv-${{ steps.slug.outputs.sha8 }}
        path: bin

    - name: Compress & Rename bin folder
      run: |
        mv bin/ AthenaEnv/
        tar -zcvf AthenaEnv.tar.gz AthenaEnv


    - name: Create Pre-release
      if: github.ref == 'refs/heads/main'
      uses: mathieucarbou/marvinpinto-action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        title: "Development build"
        files: |
               AthenaEnv.tar.gz

    - name: Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: AthenaEnv.tar.gz
        tag_name: ${{ steps.tag.outputs.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
